<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16302b">

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
:root{
  --ink:#16302b; --ink2:#3d5550; --mut:#7a8b87; --paper:#f6f1e7; --card:#fffdf8; --line:#e4dccb;
  --acc:#e2573b; --acc2:#f3b13c; --ok:#2f8f5b; --bad:#c8413a;
  --bC:#5b6fd6; --bD:#2f8f7a; --bA:#d0706a; --bB:#b9822f; --bE:#7a5bb8; --bF:#4f8aa8; --bT:#e2573b;
  --r:16px; --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(76px + var(--safe-b))}
h1,h2,h3,.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400;letter-spacing:.01em}
h1{font-size:1.9rem;line-height:1.1}
h2{font-size:1.45rem;line-height:1.15;margin-bottom:.4rem}
h3{font-size:1.15rem}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 24px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-family:"DM Serif Display",serif;font-size:1.25rem}
.brand b{color:var(--acc);font-weight:400}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--ink);color:var(--paper)}
.pill.soft{background:var(--line);color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero{background:var(--ink);color:var(--paper);border:0;position:relative;overflow:hidden}
.hero h2{color:#fff}
.hero .big{font-family:"DM Serif Display",serif;font-size:3rem;line-height:1;color:var(--acc2)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--acc2);opacity:.12}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;font-size:1.02rem;text-align:center;margin-top:12px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.dark{background:var(--ink)}
.btn.light{background:var(--paper);color:var(--ink)}
.btn[disabled]{opacity:.4}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.tile .ic{font-size:1.4rem}
.tile b{display:block;font-weight:600}
.tile small{color:var(--mut);font-size:.8rem}
.mut{color:var(--mut)} .small{font-size:.85rem}
.stat{display:flex;gap:10px}
.stat>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat .n{font-family:"DM Serif Display",serif;font-size:1.8rem;line-height:1}
.stat .l{font-size:.75rem;color:var(--mut)}
.week{display:flex;gap:6px;margin-top:10px}
.week .d{flex:1;text-align:center;font-size:.7rem;color:#ffffffaa}
.week .d i{display:block;height:28px;border-radius:8px;margin-bottom:3px;background:#ffffff22}
.week .d.on i{background:var(--acc2)}
.week .d.today i{outline:2px solid #fff}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.area{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.area:last-child{border-bottom:0}
.area .nm{flex:1;font-size:.92rem}
.area .pc{width:42px;text-align:right;font-size:.8rem;color:var(--mut)}
.area .bar{width:90px}
.area.off{opacity:.45}
.blk{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 2px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b));z-index:10}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--mut);padding:4px}
.tabs button span{font-size:1.25rem;line-height:1.2}
.tabs button.on{color:var(--ink);font-weight:600}
/* exercise */
.ex-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ex-top .bar{flex:1;height:10px}
.ex-top .bar>i{background:var(--acc)}
.x{font-size:1.4rem;color:var(--mut);padding:2px 6px}
.kind{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.prompt{font-family:"DM Serif Display",serif;font-size:1.7rem;line-height:1.15;margin-bottom:6px}
.sent{font-size:1.1rem;line-height:1.5;margin:8px 0 4px}
.sent u{text-decoration:none;border-bottom:3px solid var(--acc2);font-weight:600}
.gapline{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink);margin:0 2px}
.opt{display:block;width:100%;text-align:left;padding:14px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;margin-top:9px;font-size:1rem}
.opt.ok{border-color:var(--ok);background:#e6f4ec}
.opt.no{border-color:var(--bad);background:#fbe9e7}
.inp{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:1.1rem;margin-top:12px}
.inp:focus{outline:none;border-color:var(--ink)}
textarea.inp{min-height:180px;font-size:1rem;line-height:1.5}
.fb{margin-top:14px;padding:14px;border-radius:12px;font-size:.95rem}
.fb.ok{background:#e6f4ec;color:#1d5d3a}
.fb.no{background:#fbe9e7;color:#8a2a24}
.fb b{display:block;font-size:1.05rem;margin-bottom:2px}
.trap{margin-top:10px;padding:10px 12px;border-left:4px solid var(--acc2);background:#fdf3de;border-radius:6px;font-size:.88rem}
.hint{color:var(--mut);font-size:.9rem;margin-top:4px;letter-spacing:.06em}
.intro-lemma{font-family:"DM Serif Display",serif;font-size:2.2rem;line-height:1.05}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink2);margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:6px 10px;border-radius:99px;border:1.5px solid var(--line);font-size:.85rem;background:var(--card)}
.chip.hit{border-color:var(--ok);background:#e6f4ec;color:#1d5d3a}
.chip.miss{border-color:var(--bad);color:var(--bad)}
.src{white-space:pre-line;background:#fff;border:1px dashed var(--ink2);border-radius:12px;padding:14px;font-size:.92rem}
.model{white-space:pre-line;font-size:.95rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:.95rem}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--ok)}
.timer{font-family:"DM Serif Display",serif;font-size:3.4rem;text-align:center;line-height:1;margin:10px 0}
.gaptext{font-size:1.02rem;line-height:2.1}
.gaptext select{padding:2px 4px;border:1.5px solid var(--ink);border-radius:8px;background:var(--card);font-size:.95rem;max-width:150px}
.gaptext select.ok{border-color:var(--ok);background:#e6f4ec}
.gaptext select.no{border-color:var(--bad);background:#fbe9e7}
.bank{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;font-size:.88rem;margin-top:8px}
.ladder{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:10px}
.ladder div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.66rem;color:var(--mut);text-align:center;line-height:1.15}
.ladder i{display:block;flex-shrink:0;width:100%;border-radius:8px 8px 3px 3px;background:var(--ink);min-height:3px}
.ladder b{font-size:.8rem;color:var(--ink);margin-bottom:2px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:9px;font-weight:600}
.seg button.on{background:var(--ink);color:#fff}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:.9rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.onb h1{font-size:2.6rem}
.route{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:18px;margin-top:12px}
.route.on{border-color:var(--acc)}
.route b{font-family:"DM Serif Display",serif;font-size:1.6rem;font-weight:400}
.spk{font-size:1.3rem;padding:4px 8px;border-radius:10px;background:var(--line);line-height:1;flex-shrink:0}
.tag.ofi{background:#16302b;color:#fff}
svg text{font-family:"IBM Plex Sans",sans-serif}
</style>
</head>

 model:"Hi everyone! I saw a campaign at my school called 'Disconnect to connect'. The main point is that a lot of teenagers look at their phones just before bed, and the light from the screen makes it harder to fall asleep, so we sleep badly. They give some simple tips. For example, leave your phone outside your bedroom, use a normal alarm clock and read a book before you go to sleep. I'm going to try it!"},
{id:"m3",level:"B2",title:"Public bike scheme",
 source:"BICI PÚBLICA · AYUNTAMIENTO DE VILLAVERDE (texto de práctica)\nAbono anual: 20 € (estudiantes: 10 €). Los primeros 30 minutos de cada viaje son gratis; después, 0,50 € cada 30 minutos.\nDevuelve la bici en cualquiera de las 25 estaciones.\nSi no la devuelves en 24 horas, se cobrará una penalización de 150 €.\nPara darte de alta necesitas la app y una tarjeta bancaria.",
 task:"An Irish exchange student staying in your town for three months asks you in an email whether the public bike scheme is worth it. Reply (150-180 words) explaining how it works and giving your advice.",
 words:[150,180],
 chunks:["according to","what this means is","I'd recommend"],
 model:"Hi Ciara,\n\nThanks for your email! I've had a look at the public bike scheme and I think it's a great option for you. According to the leaflet, a yearly pass normally costs 20 euros, but students only pay half, so it would cost you 10 euros. The first half hour of every trip is free, and after that you pay 50 cents for every extra 30 minutes. What this means is that if you use it to get to school or the centre, you'll probably never pay anything extra.\n\nThe system is quite flexible, because you can return the bike at any of the 25 stations in town. However, be careful: if you don't return it within 24 hours, they'll charge you 150 euros. To sign up, you need to download the app and have a bank card.\n\nAll in all, I'd recommend getting the pass as soon as you arrive. It's cheap, healthy and much faster than the bus!\n\nSee you soon,\nIker"},
{id:"m4",level:"B2",title:"Food waste at home",
 source:"INFOGRAFÍA «NO LO TIRES» (datos de práctica)\nCasi la mitad de la comida que se tira se desperdicia en los hogares.\nCausas principales: comprar de más, no entender las fechas y cocinar demasiado.\n«Consumir preferentemente antes de» = el alimento sigue siendo seguro después de esa fecha.\n«Fecha de caducidad» = no lo comas después de esa fecha.\nConsejo: haz una lista antes de comprar y congela lo que sobra.",
 task:"Your school's English blog is running a series on sustainability. Write a short article (150-180 words) for international readers explaining the key messages of this infographic.",
 words:[150,180],
 chunks:["the key thing to remember","in other words","it might be a good idea to"],
 model:"Is your fridge part of the problem?\n\nA recent campaign in Spain shows that almost half of all the food that is thrown away is wasted at home, not in shops or restaurants. The main reasons are surprisingly simple: we buy more than we need, we cook too much and we don't understand the dates on the packaging.\n\nThe key thing to remember is that there are two different labels. 'Best before' means the food is still safe after that date, although it may not taste quite as good. In other words, you don't have to throw it away immediately. However, a 'use by' date is different: you shouldn't eat the product after that day.\n\nSo what can we do? It might be a good idea to write a shopping list before going to the supermarket, so you don't buy things you won't use. Moreover, if you cook too much, you can freeze the leftovers instead of throwing them away. Small changes like these can make a real difference."},
{id:"m5",level:"B1",title:"Language camp rules",
 source:"CAMPAMENTO DE VERANO · NORMAS\nLos móviles se entregan al llegar y se devuelven de 20:00 a 21:00.\nHay que llevar saco de dormir, linterna y crema solar.\nLas actividades empiezan a las 9:00; el desayuno es de 8:00 a 8:45.\nNo se puede salir del campamento sin un monitor.",
 task:"Your Scottish cousin is coming to the same summer camp as you. Write an email (60-80 words) telling her the most important rules.",
 words:[60,80],
 chunks:["you have to","don't forget","you can't"],
 model:"Hi Kirsty!\n\nI'm so happy you're coming to the camp! Here are the most important rules. You have to give your phone to the monitors when you arrive, but you can use it every evening from 8 to 9. Don't forget to bring a sleeping bag, a torch and sun cream. Breakfast is from 8 to 8:45 and activities start at 9. Also, you can't leave the camp without a monitor.\n\nSee you there!\nNerea"},
{id:"m6",level:"B2",title:"Exchange with Ireland",
 source:"INTERCAMBIO ESCOLAR CON CORK (IRLANDA) · 4º ESO\nDos semanas en abril, alojamiento con familias irlandesas.\nPrecio: 450 € (incluye vuelo y seguro). Ayudas para familias con menos ingresos.\nRequisitos: nota media de 6 en inglés y una carta de motivación en inglés.\nPlazo: hasta el 15 de enero. Reunión informativa para familias el 10 de diciembre.",
 task:"Your friend Ahmed arrived from Morocco this year and doesn't read Spanish well yet. He asks you about the exchange in a chat message. Write a reply (150-180 words) explaining what it is, what he needs to do and anything he should be careful about.",
 words:[150,180],
 chunks:["basically","as long as","make sure"],
 model:"Hi Ahmed! Sure, I'll explain. Basically, it's a two-week exchange in Cork, in Ireland, for students in our year. It takes place in April and you stay with an Irish family, which is a fantastic way to improve your English.\n\nIt costs 450 euros, but that includes the flight and the insurance, so there are no extra travel costs. Also, the school offers financial help for families with lower incomes, so don't let the price stop you.\n\nYou can apply as long as your average mark in English is at least 6. You also have to write a motivation letter in English explaining why you want to go. Make sure you send everything before 15th January, because that's the deadline and they're quite strict.\n\nOne more thing: there's an information meeting for families on 10th December. It might be a good idea to go with your parents, so they can ask questions. If you want, I can help you with the letter!"}
];

let ITEMS=[], BYID={};
function slug(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function mkItem(o){
  o.level=(o.level||"").toUpperCase().trim(); o.area=(o.area||"").trim();
  if(!o.lemma||!AREA[o.area]||!/^B[12]$/.test(o.level)) return null;
  o.example=o.example||o.lemma;
  const m=o.example.match(/\[(.+?)\]/);
  o.target=m?m[1]:o.lemma;
  o.plain=o.example.replace(/[\[\]]/g,"");
  o.id=slug(o.level+"-"+o.area+"-"+o.lemma);
  o.block=AREA[o.area].block;
  o.eu=(o.eu||"").trim(); o.es=(o.es||"").trim();
  o.upgrade=(o.upgrade||"").trim(); o.trap=(o.trap||"").trim(); o.ofi=(o.ofi||"").trim().toUpperCase();
  return o;
}
function parseRaw(txt){
  return txt.split("\n").map(l=>l.trim()).filter(l=>l&&!l.startsWith("#")).map(l=>{
    const [level,area,lemma,es,example,upgrade,trap,eu,ofi]=l.split("|").map(s=>(s||"").trim());
    return mkItem({level,area,lemma,es,example,upgrade,trap,eu,ofi});
  }).filter(Boolean);
}
function parseCSV(txt){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c=='"'){if(txt[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true; else if(c==','){row.push(f);f=""} else if(c=='\n'){row.push(f);rows.push(row);row=[];f=""} else if(c!='\r')f+=c;}
  if(f||row.length){row.push(f);rows.push(row)}
  const h=rows.shift().map(s=>s.replace(/^﻿/,"").trim().toLowerCase());
  return rows.map(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]||"").trim());
    return mkItem({level:o.level,area:o.area,lemma:o.lemma,eu:o.eu,es:o.es,example:o.example,upgrade:o.upgrade_from,trap:o.trap,ofi:o.oficial})}).filter(Boolean);
}
function setItems(list){ITEMS=list;BYID={};list.forEach(i=>BYID[i.id]=i)}
function gloss(it){return it.eu&&it.es?`${it.eu} · ${it.es}`:(it.eu||it.es)}

/* ======================= STATE ======================= */
let S, MEM=null;
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(ds,n){const [y,m,d]=ds.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function fresh(){return {v:2,route:null,levelUp:false,newPerDay:NEW_DEFAULT,items:{},days:{},mocks:[],med:[],speak:0,traps:{n:0,ok:0},diag:null,created:today()}}
function load(){try{const r=localStorage.getItem(STORE_KEY);S=r?JSON.parse(r):fresh()}catch(e){S=MEM||fresh()} S=Object.assign(fresh(),S)}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){MEM=S}}
function st(id){return S.items[id]||{b:0}}
function dayRec(){const t=today();return S.days[t]||(S.days[t]={n:0,ok:0,nw:0,done:false})}

/* ======================= POOL / SRS ======================= */
function inPool(it){
  if(S.onlyOfi&&!it.ofi) return false;
  if(S.route==="B1") return it.level==="B1"||(S.levelUp&&it.level==="B2");
  if(S.route==="B2") return it.level==="B2"||(S.diag&&S.diag.fails&&S.diag.fails.includes(it.id))||!!S.items[it.id];
  return false;
}
function pool(){return ITEMS.filter(inPool)}
function dueList(){const t=today();return pool().filter(i=>{const s=S.items[i.id];return s&&s.b>0&&s.d<=t}).sort((a,b)=>S.items[a.id].d.localeCompare(S.items[b.id].d))}
function newList(){
  const fails=(S.diag&&S.diag.fails)||[];
  const p=pool().filter(i=>!S.items[i.id]);
  const first=p.filter(i=>fails.includes(i.id));
  const by={};p.filter(i=>!fails.includes(i.id)).forEach(i=>(by[i.area]=by[i.area]||[]).push(i));
  Object.values(by).forEach(shuffleInPlace);
  const keys=shuffleInPlace(Object.keys(by));const out=[...first];let k=0;
  while(keys.some(a=>by[a].length)){const a=keys[k%keys.length];if(by[a].length)out.push(by[a].shift());k++}
  return out;
}
function plan(){
  const dr=S.days[today()]||{nw:0};
  const due=dueList().slice(0,MAX_REVIEWS);
  const nNew=Math.max(0,Math.min(S.newPerDay-(dr.nw||0), due.length>18?4:S.newPerDay));
  return {due,nw:newList().slice(0,nNew)};
}
// Errepasoen ariketa mota kutxaren arabera: dena ekoizpena, ez dago aukera anitzik.
function kindFor(it){
  const b=st(it.id).b||0;
  if(b<=1) return "recallhint";
  if(b===2) return "gaptype";
  if(b===3) return "recall";
  if(b===4) return "gaptype";
  if(b===5) return it.upgrade?"upgrade":"recall";
  return "recall";
}
function applyResult(it,ok){
  const s=S.items[it.id]||{b:0,c:0,w:0};
  if(ok){s.b=Math.min(6,(s.b||0)+1);s.c=(s.c||0)+1}
  else{s.b=(s.b||0)<=2?1:s.b-2;s.w=(s.w||0)+1}
  s.d=addDays(today(),INTERVALS[s.b]); s.l=today();
  S.items[it.id]=s;
  const dr=dayRec();dr.n++;if(ok)dr.ok++;
  save();return s;
}
function applyNew(it,score){ // score: 0-2 asmatze (learn1 + learn2)
  const b=score===2?2:1;
  S.items[it.id]={b,c:score,w:2-score,d:addDays(today(),INTERVALS[b]),l:today()};
  const dr=dayRec();dr.nw++;save();return S.items[it.id];
}

/* ======================= UTILS ======================= */
function shuffleInPlace(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,n){return shuffleInPlace(a.slice()).slice(0,n)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/won't/g,"will not").replace(/can't|cannot/g,"can not").replace(/n't/g," not").replace(/'s\b/g," is").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'ll\b/g," will").replace(/'d\b/g," would").replace(/'ve\b/g," have").replace(/[“”]/g,'"').replace(/[.!?¡¿,;:"]+/g," ").replace(/\s+/g," ").trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[n]}
function matchAns(ans,targets){const a=norm(ans);for(const t of targets){const n=norm(t);if(!n)continue;if(a===n)return "exact";const tol=n.length>9?2:n.length>4?1:0;if(lev(a,n)<=tol)return "typo"}return false}
function hintOf(t){return t.split(" ").map(w=>w[0]+"_".repeat(Math.max(0,w.replace(/[^a-zA-Z]/g,"").length-1))).join("  ")}
const STOP=new Set(["sth","sb","the","a","an","to","of","your","my","be","is","am","are","it","i","you"]);
function usesChunk(text,chunk){
  const toks=norm(chunk).split(" ").filter(w=>w.length>=2&&!STOP.has(w));
  if(!toks.length) return norm(text).includes(norm(chunk));
  const words=norm(text).split(" ");
  return toks.every(t=>{const stem=t.slice(0,Math.max(3,t.length-2));return words.some(w=>w.startsWith(stem))});
}
function wc(t){return (t.trim().match(/\S+/g)||[]).length}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}
function pct(x){return Math.round(x*100)}
function $(s){return document.querySelector(s)}
function boxLabel(b){return ["Berria","Ikasten","Testuinguruan","Gogoratzen","Idazten","Erabiltzen","Menperatuta"][b]||""}
function inDays(n){return n===1?"bihar":`${n} egun barru`}
let VOICE=null, UTT=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();
  return vs.find(v=>/en[-_]GB/i.test(v.lang)&&/google|natural|neural|enhanced|premium/i.test(v.name))||vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){return null}}
function say(t){
  if(!canSpeak){toast("Nabigatzaile honek ez du audiorik onartzen");return}
  const syn=window.speechSynthesis;
  const speakNow=()=>{
    try{
      UTT=new SpeechSynthesisUtterance(t); // erreferentzia globala: Chromek ez dezan ezabatu
      UTT.lang="en-GB";UTT.rate=.9;
      VOICE=VOICE||pickVoice();if(VOICE)UTT.voice=VOICE;
      let started=false;
      UTT.onstart=()=>{started=true};
      UTT.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")toast("Ezin izan da audioa erreproduzitu")};
      syn.resume();syn.speak(UTT);
      setTimeout(()=>{if(!started&&!syn.speaking)toast(pickVoice()?"Audioa ez da abiatu: igo bolumena edo desaktibatu modu isila":"Gailu honek ez du ingelesezko ahotsik. Probatu Chrome edo Safarirekin.")},1800);
    }catch(e){toast("Ezin izan da audioa erreproduzitu")}
  };
  // Chrome: cancel() eta speak() jarraian deitzean, esaldia isilean galtzen da
  if(syn.speaking||syn.pending){syn.cancel();setTimeout(speakNow,80)}else speakNow();
}
const canSpeak=("speechSynthesis" in window);
function spk(t){return canSpeak?`<button class="spk" data-say="${esc(t)}" aria-label="Entzun">🔊</button>`:""}
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.preventDefault();say(b.dataset.say)}});

/* ======================= METRICS ======================= */
function areaMastery(aid){
  const its=pool().filter(i=>i.area===aid);if(!its.length)return null;
  let s=0;its.forEach(i=>s+=(st(i.id).b||0));return s/(6*its.length);
}
function counts(){
  const p=pool();let seen=0,prod=0,mast=0;const box=[0,0,0,0,0,0,0];
  p.forEach(i=>{const b=st(i.id).b||0;box[b]++;if(b>0)seen++;if(b>=3)prod++;if(b>=6)mast++});
  return {total:p.length,seen,prod,mast,box};
}
function weekDays(){const out=[];for(let i=6;i>=0;i--){const d=addDays(today(),-i);const r=S.days[d];out.push({d,on:!!(r&&r.n>0)})}return out}

/* ======================= DIAGNOSTIC (B2) ======================= */
function startDiag(){
  const qs=sample(ITEMS.filter(i=>i.level==="B1"),24);
  let k=0;const fails=[],known=[];
  shell(`<div class="wrap"><h2>B1eko diagnostiko azkarra</h2><p class="mut">B1eko 24 hitz. Huts egiten dituzunak zure sortan sartuko dira oinarri gisa. Ez badakizu, sakatu «Ez dakit»: ez asmatu zoriz.</p><button class="btn" id="s">Goazen</button><button class="btn ghost" id="skip">Diagnostikoa saltatu</button></div>`,false);
  $("#skip").onclick=()=>{S.diag={done:today(),fails:[]};save();go("home")};
  $("#s").onclick=step;
  function step(){
    if(k>=qs.length){
      known.forEach(id=>{S.items[id]={b:3,c:1,w:0,d:addDays(today(),4),l:today()}});
      S.diag={done:today(),fails};save();
      shell(`<div class="wrap"><h2>Diagnostikoa eginda</h2><div class="card"><div class="stat"><div><div class="n">${known.length}</div><div class="l">badakizkizu</div></div><div><div class="n">${fails.length}</div><div class="l">indartzeko</div></div></div></div><p class="mut">Huts egin dituzunak lehenik agertuko dira zure saioetan, B2koekin batera.</p><button class="btn" id="h">Nire egunera</button></div>`,false);
      $("#h").onclick=()=>go("home");return;
    }
    const it=qs[k];const opts=shuffleInPlace([gloss(it),...distractorsFor(it,3).map(gloss)]);
    shell(`<div class="wrap"><div class="ex-top"><div class="bar"><i style="width:${pct(k/qs.length)}%"></i></div><span class="small mut">${k+1}/${qs.length}</span></div>
      <div class="kind">Zer esan nahi du?</div><div class="prompt">${esc(it.lemma)}</div><div class="sent mut">${esc(it.plain)}</div>
      ${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}
      <button class="opt" data-o="__no" style="text-align:center;color:var(--mut)">Ez dakit</button></div>`,false);
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{(b.dataset.o===gloss(it)?known:fails).push(it.id);k++;step()});
  }
}
function distractorsFor(it,n){
  let c=ITEMS.filter(x=>x.area===it.area&&x.id!==it.id&&gloss(x)!==gloss(it));
  return sample(c,n);
}

/* ======================= SESSION ENGINE =======================
   Hitz berriak: 4ko taldeetan aurkezten dira. Talde baten lehen proba (euskara/gaztelania → ingelesa, pista batekin)
   hurrengo taldearen ondoren dator; bigarren proba (hutsunea testuinguruan, pistarik gabe) saioaren amaieran.
   Bi probak gainditzen badira, hitza 2. kutxara doa; bestela, 1.era (bihar itzultzen da). */
let SES=null;
function startSession(due,nw,mode,label){
  if(!due.length&&!nw.length){toast("Ez dago itemik hemen");return}
  const rev=due.map(it=>({id:it.id,t:"review"}));
  const groups=[];for(let i=0;i<nw.length;i+=GROUP)groups.push(nw.slice(i,i+GROUP));
  const q=[];
  groups.forEach((g,gi)=>{
    g.forEach(it=>q.push({id:it.id,t:"intro"}));
    q.push(...rev.splice(0,3));
    if(gi>0) shuffleInPlace(groups[gi-1].slice()).forEach(it=>q.push({id:it.id,t:"learn1"}));
  });
  if(groups.length){q.push(...rev.splice(0,3));shuffleInPlace(groups[groups.length-1].slice()).forEach(it=>q.push({id:it.id,t:"learn1"}))}
  q.push(...rev);
  shuffleInPlace(nw.slice()).forEach(it=>q.push({id:it.id,t:"learn2"}));
  SES={mode,label,queue:q,i:0,ok:0,answered:0,ups:0,start:Date.now(),learn:{},nNew:nw.length};
  nextEx();
}
function nextEx(){
  if(SES.i>=SES.queue.length) return endSession();
  const q=SES.queue[SES.i];const it=BYID[q.id];
  if(q.t==="intro") return renderIntro(it);
  const kind=q.t==="learn1"?"recallhint":q.t==="learn2"?"gaptype":q.t==="retry"?"recallhint":q.t==="upgrade"?"upgrade":kindFor(it);
  renderEx(it,kind,q);
}
function topBar(){const n=SES.queue.length;return `<div class="ex-top"><button class="x" id="quit">✕</button><div class="bar"><i style="width:${pct(SES.i/n)}%"></i></div><span class="small mut">${Math.min(SES.i+1,n)}/${n}</span></div>`}
function bindQuit(){$("#quit").onclick=()=>{if(confirm("Irten? Egindakoa gordeta dago."))go(TAB)}}
function hl(it){return esc(it.example).replace(/\[(.+?)\]/,"<u>$1</u>")}
function renderIntro(it){

    <div class="card"><span class="tag">${it.level}</span>${it.ofi?`<span class="tag ofi">EOIDNA ${it.ofi}</span>`:""}<span class="tag">${AREA[it.area].name}</span>

    ${it.trap?`<div class="trap">⚠ ${esc(it.trap)}</div>`:""}
    ${it.upgrade?`<div class="small mut" style="margin-top:8px">Oinarrizkoagoa den hau ordezkatzen du: <i>${esc(it.upgrade)}</i></div>`:""}
    </div>
    <p class="small mut">Irakurri ozen, entzun eta saiatu gogoratzen. Laster idatzi beharko duzu, pistarik gabe.</p>
    <button class="btn dark" id="ok">Hurrengoa</button></div>`,false);
  bindQuit();$("#ok").onclick=()=>{SES.i++;nextEx()};
}
function renderEx(it,kind,q){
  const gapSent=esc(it.example).replace(/\[(.+?)\]/,'<span class="gapline">&nbsp;</span>');
  const isLearn=q.t==="learn1"||q.t==="learn2";
  const tagNew=isLearn?`<span class="tag" style="background:#fdf3de">hitz berria</span>`:"";
  let body="",targets;
  if(kind==="recallhint"||kind==="recall"){
    body=`<div class="kind">Nola esaten da ingelesez? ${tagNew}</div><div class="prompt">${esc(it.eu)}</div><div class="mut">${esc(it.es)}</div>
      ${kind==="recallhint"?`<div class="hint" style="font-size:1.1rem;margin-top:8px">${esc(hintOf(it.lemma))}</div>`:`<button class="small mut" id="ctx" style="margin-top:6px;text-decoration:underline">Pista bat</button><div id="ctxv"></div>`}`;
    targets=[it.lemma,it.target];
  }else if(kind==="gaptype"){
    body=`<div class="kind">Idatzi falta dena ${tagNew}</div><div class="sent" style="font-size:1.2rem">${gapSent}</div><div class="mut small">(${esc(gloss(it))})</div>`;
    targets=[it.target];
  }else if(kind==="upgrade"){
    const base=esc(it.example).replace(/\[(.+?)\]/,`<u>${esc(it.upgrade)}</u>`);
    body=`<div class="kind">Upgrade · igo maila</div><div class="sent" style="font-size:1.15rem">${base}</div><p class="mut small">Aldatu azpimarratutakoa adierazpen zehatzago batekin. Pista: <b>${esc(gloss(it))}</b> · ${esc(hintOf(it.target))}</p>`;
    targets=[it.target,it.lemma];
  }
  shell(`<div class="wrap">${topBar()}${body}
    <input class="inp" id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Idatzi ingelesez">
    <button class="btn dark" id="chk">Egiaztatu</button>
    <button class="btn ghost" id="idk" style="margin-top:8px">Ez dakit</button>
    <div id="fb"></div></div>`,false);
  bindQuit();
  if($("#ctx"))$("#ctx").onclick=()=>{$("#ctxv").innerHTML=`<div class="hint">${esc(hintOf(it.lemma))}</div>`;$("#ctx").remove()};
  const inp=$("#in");setTimeout(()=>inp.focus(),60);
  const check=(giveUp)=>{
    if($("#nx"))return; if(!giveUp&&!inp.value.trim())return;
    let r=false;
    if(!giveUp){r=matchAns(inp.value,targets);if(!r&&kind==="upgrade"&&usesChunk(inp.value,it.target))r="typo"}
    inp.disabled=true;$("#chk").remove();$("#idk").remove();
    finish(!!r,r==="typo");
  };
  $("#chk").onclick=()=>check(false);$("#idk").onclick=()=>check(true);
  inp.onkeydown=e=>{if(e.key==="Enter")check(false)};
  function finish(ok,typo){
    let info="";
    if(q.t==="review"||q.t==="upgrade"){
      const s=applyResult(it,ok);SES.answered++;if(ok){SES.ok++;SES.ups++}
      if(!ok) SES.queue.push({id:it.id,t:"retry"});
      info=ok?`Hurrengo errepasoa: <b style="display:inline">${inDays(INTERVALS[s.b])}</b> · ${boxLabel(s.b)}`:`Saioaren amaieran berriro agertuko da, eta bihar ere bai.`;
    }else if(q.t==="learn1"){
      SES.learn[it.id]=ok?1:0;SES.answered++;if(ok)SES.ok++;
      info=ok?"Saioaren amaieran berriro probatuko duzu, testuinguruan.":"Ez kezkatu: saioaren amaieran berriro probatuko duzu.";
    }else if(q.t==="learn2"){
      const sc=(SES.learn[it.id]||0)+(ok?1:0);const s=applyNew(it,sc);SES.answered++;if(ok)SES.ok++;if(sc===2)SES.ups++;

let TMR=null,REC=null,CUR_SPEAK=null;

  function run(){clearInterval(TMR);TMR=setInterval(()=>{t--;$("#tm").textContent=fmt(Math.max(0,t));

      if(phase===1){phase=2;t=talk;$("#ph").textContent="Hitz egin!";$("#tm").textContent=fmt(t);$("#go").textContent="Amaitu";if($("#rec").checked)startRec();run()}
      else{phase=3;$("#ph").textContent="Denbora amaitu da";$("#go").style.display="none";stopRec();S.speak++;dayRec();save();

  },1000)}
}
async function startRec(){
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];REC=new MediaRecorder(stream);
    REC.ondataavailable=e=>ch.push(e.data);
    REC.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const url=URL.createObjectURL(new Blob(ch,{type:REC.mimeType||"audio/webm"}));

    REC.start()}catch(e){toast("Ezin izan da mikrofonoa erabili")}
}

    <button class="btn dark" id="im">Berreskuratu</button></div>
   <div class="card"><h3>Nola instalatu</h3><p class="small">Mugikorrean, ireki nabigatzailearen menua eta aukeratu <b>«Gehitu hasierako pantailan»</b>. Aplikazio bat bezala irekiko da.</p></div>
   <button class="btn ghost" id="rs" style="border-color:var(--bad);color:var(--bad)">Dena ezabatu eta hutsetik hasi</button>
   <p class="small mut" style="margin-top:14px;text-align:center">${ITEMS.length} item · ${TRAPS.length} tranpa · ${GAPS.length} simulakro</p>
  </div>`);
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(b.dataset.r===S.route)return;S.route=b.dataset.r;save();if(S.route==="B2"&&!S.diag)startDiag();else viewSettings()});
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{S.newPerDay=+b.dataset.n;save();viewSettings()});
  $("#of").onchange=e=>{S.onlyOfi=e.target.checked;save();toast(S.onlyOfi?"Programazio ofiziala soilik":"Hiztegi osoa")};
  if($("#lu"))$("#lu").onchange=e=>{S.levelUp=e.target.checked;save();toast(S.levelUp?"B2 aktibatuta":"B1 bakarrik")};
  $("#ex").onclick=async()=>{const code="LXK1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    try{await navigator.clipboard.writeText(code);toast("Kodea kopiatuta")}catch(e){$("#imp").value=code;toast("Kopiatu laukiko kodea")}};
  $("#im").onclick=()=>{const v=$("#imp").value.trim();try{if(!v.startsWith("LXK1:"))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));if(!o.items)throw 0;S=Object.assign(fresh(),o);save();toast("Aurrerapena berreskuratuta");go("home")}catch(e){toast("Kode baliogabea")}};
  $("#rs").onclick=()=>{if(confirm("Ziur zaude? Zure aurrerapen guztia ezabatuko da.")){S=fresh();save();go("home")}};
}

/* ======================= BOOT ======================= */
(async function boot(){
  setItems(parseRaw(RAW_ITEMS));
  load();
  if(SHEET_CSV_URL){
    try{const r=await fetch(SHEET_CSV_URL,{cache:"no-store"});if(r.ok){const l=parseCSV(await r.text());if(l.length>50){setItems(l);try{localStorage.setItem(STORE_KEY+"-sheet",JSON.stringify(l))}catch(e){}}}}
    catch(e){try{const c=localStorage.getItem(STORE_KEY+"-sheet");if(c)setItems(JSON.parse(c))}catch(_){}}
  }
  if(canSpeak){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{VOICE=pickVoice()}}catch(e){}}
  render();
})();

</script>
<script>if("serviceWorker" in navigator&&window.isSecureContext){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
</body>
</html>
